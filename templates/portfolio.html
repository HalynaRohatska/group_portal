<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Моє портфоліо</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
  
  <style>
    body {
      background-color: #0f1115;
      color: #d1d5db;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    .fixed-nav {
      position: fixed;
      top: 1.2rem;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .left-nav {
      background: rgba(15, 17, 21, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 50px;
      padding: 0.5rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .btn-nav {
      background: transparent;
      border: none;
      color: #d1d5db;
      font-weight: 500;
      padding: 0.6rem 1.1rem;
      transition: all 0.3s;
      font-size: 1rem;
    }
    .btn-nav:hover {
      color: white;
      background: rgba(255,255,255,0.08);
      border-radius: 30px;
    }

    .btn-nav-active {
      color: white;
      background: rgba(59,130,246,0.25);
      border-radius: 30px;
    }

    .btn-auth {
      padding: 0.6rem 1.4rem;
      font-weight: 500;
      border-radius: 30px;
      transition: all 0.3s;
      background: transparent;
      border: 1px solid #6b7280;
      color: #d1d5db;
    }

    .btn-auth:hover {
      background: #1f2937;
      color: white;
    }

    .section-padding {
      padding: 9rem 0 7rem;
    }

    .portfolio-hero {
      text-align: center;
      padding: 6rem 2rem 4rem;
    }
    .portfolio-hero h1 {
      font-size: 3.8rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .project-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
      height: 100%;
    }
    .project-card:hover {
      border-color: #3b82f6;
      transform: translateY(-6px);
      box-shadow: 0 12px 35px rgba(59,130,246,0.18);
    }
    .project-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
    .btn-add-project {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .btn-add-project:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    .badge-tech {
      background: #3b82f6;
      color: white;
      margin-right: 0.4rem;
      margin-bottom: 0.4rem;
    }

    .modal-content {
      background: #161b22;
      color: #d1d5db;
      border: 1px solid #3b82f6;
    }
    .modal-header, .modal-footer {
      border-color: #30363d;
    }
    .form-control, textarea.form-control {
      background: #0f1115;
      border: 1px solid #30363d;
      color: #d1d5db;
    }
    .form-control:focus, textarea.form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 0.25rem rgba(59,130,246,0.25);
    }
  </style>
</head>
<body>

  <!-- Навігація (така ж як на всіх сторінках) -->
  <div class="fixed-nav">
    <div class="left-nav d-flex gap-2 flex-wrap">
      <button type="button" class="btn btn-nav">Головна</button>
      <button type="button" class="btn btn-nav">Про нас</button>
      <button type="button" class="btn btn-nav btn-nav-active">Портфоліо</button>
      <button type="button" class="btn btn-nav">Галерея</button>
      <button type="button" class="btn btn-nav">Події</button>
      <button type="button" class="btn btn-nav">Оголошення</button>
    </div>

    <div class="right-auth">
      <!-- Ось твоя кнопка Вихід — точнісінько як була кнопка Вхід -->
      <a href="{% url 'logout' %}" class="btn btn-auth btn-login">Вихід</a>
    </div>
  </div>

  <!-- Hero блок -->
  <section class="portfolio-hero">
    <div class="container">
      <h1>Моє портфоліо</h1>
      <p class="lead-text">
        Тут ти можеш додавати свої найкращі проєкти та показувати їх світу
      </p>

      <button type="button" class="btn btn-add-project btn-lg" data-bs-toggle="modal" data-bs-target="#addProjectModal">
        + Додати проєкт
      </button>
    </div>
  </section>

  <!-- Список проєктів -->
  <section class="section-padding">
    <div class="container">
      <div class="row g-4">
        <!-- Приклад однієї картки (щоб бачити як виглядатиме) -->
        <div class="col-md-6 col-lg-4">
          <div class="project-card">
            <img src="https://images.unsplash.com/photo-1557683316-973673baf926?w=800" class="project-img" alt="Проєкт">
            <div class="p-4">
              <h4 class="mb-2">Мій перший проєкт</h4>
              <p class="text-secondary mb-3">
                Короткий опис. Що робить, які технології, результат.
              </p>
              <div class="mb-3">
                <span class="badge badge-tech">Django</span>
                <span class="badge badge-tech">React</span>
              </div>
              <div class="d-flex gap-3">
                <a href="#" class="text-primary text-decoration-none">Сайт</a>
                <a href="#" class="text-warning text-decoration-none">GitHub</a>
              </div>
            </div>
          </div>
        </div>

        <!-- Місце для всіх твоїх проєктів (вставляй тут цикл Django) -->
      </div>
    </div>
  </section>

  <!-- Модалка додавання проєкту (залишається та сама) -->
  <div class="modal fade" id="addProjectModal" tabindex="-1" aria-labelledby="addProjectModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addProjectModalLabel">Додати новий проєкт</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form method="post" action="{% url 'add_project' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <!-- поля форми... -->
            <!-- (встав сюди свій код форми додавання) -->
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Скасувати</button>
          <button type="submit" form="addProjectForm" class="btn btn-primary">Додати</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>

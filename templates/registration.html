<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Реєстрація</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
  
  <style>
    body {
      background-color: #0f1115;
      color: #d1d5db;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    .back-btn {
      position: absolute;
      top: 1.5rem;
      left: 2rem;
      z-index: 1000;
      background: rgba(15, 17, 21, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
      color: #d1d5db;
      padding: 0.6rem 1.2rem;
      border-radius: 50px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .back-btn:hover {
      color: white;
      background: rgba(255,255,255,0.08);
    }

    .auth-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .auth-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 3.5rem 3rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 50px rgba(0,0,0,0.6);
    }
    .auth-card h2 {
      text-align: center;
      margin-bottom: 2.5rem;
      font-weight: 700;
    }
    .form-control {
      background: #0f1115;
      border: 1px solid #30363d;
      color: #d1d5db;
      padding: 0.75rem 1.25rem;
    }
    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 0.25rem rgba(59,130,246,0.25);
    }
    .btn-submit {
      width: 100%;
      padding: 0.9rem;
      font-size: 1.1rem;
      border-radius: 50px;
      background: #3b82f6;
      border: none;
      color: white;
      transition: all 0.3s;
    }
    .btn-submit:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    .text-center a {
      color: #3b82f6;
      text-decoration: none;
    }
    .text-center a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- КНОПКА НАЗАД (єдина кнопка зверху) -->
  <a href="{% url 'home' %}" class="back-btn">← Назад на головну</a>

  <!-- Форма реєстрації -->
  <div class="auth-container">
    <div class="auth-card">
      <h2>Реєстрація</h2>
      
      <form method="post" action="{% url 'register' %}">

        <div class="mb-4">
          <label for="username" class="form-label">Ім'я користувача</label>
          <input type="text" class="form-control" id="username" name="username" required placeholder="Введіть username">
        </div>

        <div class="mb-4">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" name="email" required placeholder="example@email.com">
        </div>

        <div class="mb-4">
          <label for="password1" class="form-label">Пароль</label>
          <input type="password" class="form-control" id="password1" name="password1" required placeholder="Мінімум 8 символів">
        </div>

        <div class="mb-4">
          <label for="password2" class="form-label">Повторіть пароль</label>
          <input type="password" class="form-control" id="password2" name="password2" required placeholder="Повторіть пароль">
        </div>

        <button type="submit" class="btn btn-submit">Зареєструватися</button>
      </form>

      <p class="text-center mt-4 mb-0">
        Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
          crossorigin="anonymous"></script>
</body>
</html>

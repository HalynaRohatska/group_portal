<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Галерея</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
  
  <style>
    body {
      background-color: #0f1115;
      color: #d1d5db;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    .fixed-nav {
      position: fixed;
      top: 1.2rem;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .left-nav {
      background: rgba(15, 17, 21, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 50px;
      padding: 0.5rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .right-auth {
      display: flex;
      gap: 0.8rem;
    }

    .btn-nav {
      background: transparent;
      border: none;
      color: #d1d5db;
      font-weight: 500;
      padding: 0.6rem 1.1rem;
      transition: all 0.3s;
      font-size: 1rem;
    }
    .btn-nav:hover {
      color: white;
      background: rgba(255,255,255,0.08);
      border-radius: 30px;
    }

    .btn-nav-disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    .btn-auth {
      padding: 0.6rem 1.4rem;
      font-weight: 500;
      border-radius: 30px;
      transition: all 0.3s;
    }
    .btn-login  { background: transparent; border: 1px solid #6b7280; color: #d1d5db; }
    .btn-login:hover  { background: #1f2937; color: white; }
    .btn-register { background: #3b82f6; border: none; color: white; }
    .btn-register:hover { background: #2563eb; }

    .section-padding {
      padding: 9rem 0 7rem;
    }
    .gallery-hero {
      background: linear-gradient(to bottom, #0f1115, #1a1f2e);
      text-align: center;
      padding: 10rem 2rem 5rem;
    }
    .gallery-hero h1 {
      font-size: 3.8rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .lead-text {
      font-size: 1.35rem;
      max-width: 800px;
      margin: 0 auto;
      color: #9ca3af;
    }
    .gallery-grid .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
    }
    .gallery-grid .card:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 35px rgba(59,130,246,0.18);
      border-color: #3b82f6;
    }
    .gallery-grid img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    .upload-btn {
      background: #3b82f6;
      border: none;
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .upload-btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    .no-auth-message {
      color: #9ca3af;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <!-- Навігація -->
  <div class="fixed-nav">
    <div class="left-nav d-flex gap-2 flex-wrap">
      <button type="button" class="btn btn-nav">Головна</button>
      <button type="button" class="btn btn-nav">Про нас</button>
      <button type="button" class="btn btn-nav btn-nav-disabled">Портфоліо</button>
      <button type="button" class="btn btn-nav">Галерея</button>
      <button type="button" class="btn btn-nav">Події</button>
      <button type="button" class="btn btn-nav">Оголошення</button>
    </div>

    <div class="right-auth">
      <button type="button" class="btn btn-auth btn-login">Вхід</button>
      <button type="button" class="btn btn-auth btn-register">Реєстрація</button>
    </div>
  </div>

  <!-- Hero секція -->
  <section class="gallery-hero">
    <div class="container">
      <h1>Галерея</h1>
      <p class="lead-text">Найкращі моменти, скріншоти проєктів, фото з подій та креатив від спільноти. Додавай свої фото після входу!</p>
      
      <!-- Кнопка додавання (показувати тільки авторизованим) -->
      <div class="mt-4">
        <button type="button" class="upload-btn btn-lg">
          + Додати фото
        </button>
      </div>
    </div>
  </section>

  <!-- Галерея – тільки одна картка для прикладу -->
  <section class="section-padding">
    <div class="container">
      <div class="row g-4 gallery-grid justify-content-center">
        <!-- Одна картка-приклад -->
        <div class="col-md-6 col-lg-4 col-xl-3">
          <div class="card">
            <img src="https://images.unsplash.com/photo-1557683316-973673baf926?w=800" alt="Приклад фото">
            <div class="card-body text-center p-3">
              <p class="mb-0 text-secondary">Приклад завантаженого фото</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
          crossorigin="anonymous"></script>
</body>
</html>

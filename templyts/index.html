<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Головна</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
        crossorigin="anonymous">
  
  <style>
    body {
      background-color: #0f1115;
      color: #d1d5db;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      margin: 0;
    }

    .fixed-nav {
      position: fixed;
      top: 1.2rem;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 0 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .left-nav {
      background: rgba(15, 17, 21, 0.7);
      backdrop-filter: blur(8px);
      border-radius: 50px;
      padding: 0.5rem 1.5rem;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .right-auth {
      display: flex;
      gap: 0.8rem;
    }

    .btn-nav {
      background: transparent;
      border: none;
      color: #d1d5db;
      font-weight: 500;
      padding: 0.6rem 1.1rem;
      transition: all 0.3s;
      font-size: 1rem;
    }
    .btn-nav:hover {
      color: white;
      background: rgba(255,255,255,0.08);
      border-radius: 30px;
    }

    /* Стиль для НЕактивної кнопки Портфоліо */
    .btn-nav-disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none; /* блокує клік */
    }
    .btn-nav-disabled:hover {
      background: transparent;
      color: #d1d5db;
    }

    .btn-auth {
      padding: 0.6rem 1.4rem;
      font-weight: 500;
      border-radius: 30px;
      transition: all 0.3s;
    }
    .btn-login {
      background: transparent;
      border: 1px solid #6b7280;
      color: #d1d5db;
    }
    .btn-login:hover {
      background: #1f2937;
      color: white;
    }
    .btn-register {
      background: #3b82f6;
      border: none;
      color: white;
    }
    .btn-register:hover {
      background: #2563eb;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1rem;
    }
    .hero h1 {
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      letter-spacing: -1px;
    }
    .hero p {
      font-size: 1.3rem;
      max-width: 720px;
      margin: 0 auto 2.5rem;
      color: #9ca3af;
    }

    .carousel-container {
      max-width: 1100px;
      margin: 0 auto;
    }
    .carousel-item img {
      height: 55vh;
      object-fit: cover;
      filter: brightness(0.55) contrast(1.1);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .carousel-caption {
      opacity: 0;
    }
  </style>
</head>
<body>

  <!-- Фіксована панель зверху -->
  <div class="fixed-nav">
    <!-- Ліва частина - меню -->
    <div class="left-nav d-flex gap-2 flex-wrap">
      <button type="button" class="btn btn-nav">Головна</button>
      <button type="button" class="btn btn-nav">Про нас</button>
      
      <!-- Портфоліо — неактивна, прозоріша -->
      <button type="button" class="btn btn-nav btn-nav-disabled">Портфоліо</button>
      
      <button type="button" class="btn btn-nav">Галерея</button>
      <button type="button" class="btn btn-nav">Події</button>
      <button type="button" class="btn btn-nav">Оголошення</button>
    </div>

    <!-- Права частина - авторизація -->
    <div class="right-auth">
      <button type="button" class="btn btn-auth btn-login">Вхід</button>
      <button type="button" class="btn btn-auth btn-register">Реєстрація</button>
    </div>
  </div>

  <!-- Головний блок -->
  <section class="hero">
    <div class="container">
      <h1>Вітаємо</h1>
      <p class="lead">Створюємо сучасні цифрові рішення, які працюють на результат</p>

      <!-- Карусель -->
      <div class="carousel-container mt-4">
        <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="2" aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="3" aria-label="Slide 4"></button>
          </div>

          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="https://images.unsplash.com/photo-1557683316-973673baf926?w=1200" class="d-block w-100" alt="Abstract dark gradient">
            </div>
            <div class="carousel-item">
              <img src="https://images.unsplash.com/photo-1553356084-58ef4a67b2a7?w=1200" class="d-block w-100" alt="Dark neon abstract">
            </div>
            <div class="carousel-item">
              <img src="https://images.unsplash.com/photo-1617791160505-6f00504e3519?w=1200" class="d-block w-100" alt="Minimal dark tech">
            </div>
            <div class="carousel-item">
              <img src="https://images.unsplash.com/photo-1557682250-33bd709cbe8b?w=1200" class="d-block w-100" alt="Dark futuristic background">
            </div>
          </div>

          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
          crossorigin="anonymous"></script>
</body>
</html>
